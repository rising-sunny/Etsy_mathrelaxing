<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Prompt Studio — A Teacher's AI Toolkit</title>
<style>
  :root{
    --paper:#F3F2EC; --panel:#FBFAF5; --ink:#1b1a17; --ink-soft:#46443e; --muted:#8b867a;
    --rule:#ded9cc; --rule-strong:#c6c0b0; --accent:#b23a2e; --accent-deep:#8c2b21;
    --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased}
  /* masthead */
  header{background:var(--paper);border-bottom:2px solid var(--ink);padding:26px 34px 20px}
  .masthead-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
  .kicker{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700}
  header h1{font-family:var(--serif);font-weight:600;font-size:31px;letter-spacing:.2px;margin:9px 0 0;color:var(--ink)}
  header h1 em{font-style:italic;color:var(--ink-soft)}
  header p{margin:9px 0 0;color:var(--ink-soft);font-size:14px;max-width:720px;font-family:var(--serif)}
  .edition{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  /* layout */
  .app{display:grid;grid-template-columns:332px 1fr;min-height:calc(100vh - 96px)}
  .side{border-right:1px solid var(--rule-strong);padding:22px 24px 40px;overflow:auto}
  .main{padding:32px 44px 54px;overflow:auto;max-width:920px}
  @media(max-width:880px){.app{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--rule-strong)}}
  /* search */
  .search{width:100%;padding:8px 2px;border:none;border-bottom:1.5px solid var(--ink);background:transparent;
          font-family:var(--serif);font-size:15px;color:var(--ink)}
  .search::placeholder{color:var(--muted);font-style:italic}
  .search:focus{outline:none;border-color:var(--accent)}
  /* category tabs */
  .chips{display:flex;flex-wrap:wrap;gap:6px 16px;margin:20px 0 4px;border-bottom:1px solid var(--rule);padding-bottom:11px}
  .chip{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;
        padding:2px 0;border-bottom:2px solid transparent;font-weight:600;user-select:none}
  .chip.active{color:var(--ink);border-color:var(--accent)}
  /* prompt index */
  .plist{list-style:none;margin:4px 0 0;padding:0}
  .pitem{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:14px 6px 13px;border-bottom:1px solid var(--rule);cursor:pointer}
  .pitem:hover{background:var(--panel)}
  .pitem.active .ttl{color:var(--accent)}
  .idx{font-family:var(--serif);font-size:14px;color:var(--muted);padding-top:3px}
  .pitem .cat{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .pitem .ttl{font-family:var(--serif);font-size:16px;color:var(--ink);margin-top:1px;line-height:1.25}
  .pitem .dsc{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-family:var(--serif)}
  /* detail */
  .empty{color:var(--muted);font-style:italic;font-family:var(--serif);margin-top:15vh;text-align:center}
  .detail .kick{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .detail h2{font-family:var(--serif);font-size:30px;color:var(--ink);margin:7px 0 0;line-height:1.15}
  .detail .sub{color:var(--ink-soft);font-family:var(--serif);font-style:italic;margin-top:9px;font-size:15px}
  .rule{height:1px;background:var(--rule-strong);margin:22px 0 2px}
  .how{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--ink-soft);
       border-left:3px solid var(--accent);padding:2px 0 2px 15px;margin:22px 0 28px}
  .how b{font-style:normal;color:var(--ink)}
  /* fields */
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 28px}
  @media(max-width:600px){.fields{grid-template-columns:1fr}}
  .field.full{grid-column:1 / -1}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:7px}
  label .req{color:var(--accent)}
  input[type=text],textarea,select{width:100%;padding:8px 2px;border:none;border-bottom:1.5px solid var(--rule-strong);
       background:transparent;font-family:var(--serif);font-size:15px;color:var(--ink)}
  textarea{min-height:70px;resize:vertical;border:1px solid var(--rule-strong);padding:11px 13px;background:var(--panel);font-size:14.5px}
  select{font-family:var(--sans);font-size:14px;padding-bottom:9px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
  /* output */
  .outwrap{margin-top:34px}
  .outhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .outhead h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0}
  .btns{display:flex;gap:10px}
  button{font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
         padding:10px 18px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:0}
  .copy{background:var(--ink);color:var(--paper)}
  .copy:hover{background:var(--accent);border-color:var(--accent)}
  .copy.done{background:var(--accent);border-color:var(--accent)}
  .reset:hover{border-color:var(--accent);color:var(--accent)}
  .output{white-space:pre-wrap;background:var(--panel);border:1px solid var(--rule-strong);border-top:3px solid var(--ink);
          padding:22px 24px;font-family:var(--mono);font-size:13px;line-height:1.72;color:var(--ink);max-height:46vh;overflow:auto}
  .output .blank{color:var(--accent);border-bottom:1.5px dotted var(--accent);font-weight:600;font-family:var(--serif);font-style:italic}
  .foot{color:var(--muted);font-size:12px;margin-top:28px;border-top:1px solid var(--rule);padding-top:14px;font-family:var(--serif);font-style:italic}
</style>
</head>
<body>
<header>
  <div class="masthead-row">
    <div>
      <div class="kicker">A Teacher's AI Toolkit</div>
      <h1>The Prompt Studio</h1>
      <p>Choose a prompt, fill in the blanks, and copy a precise, expert-level instruction — ready for ChatGPT, Claude or Gemini. Works offline, right in your browser.</p>
    </div>
    <div class="edition">No. 01 — Prototype</div>
  </div>
</header>

<div class="app">
  <aside class="side">
    <input id="search" class="search" type="text" placeholder="Search prompts…" autocomplete="off">
    <div id="chips" class="chips"></div>
    <ul id="plist" class="plist"></ul>
  </aside>
  <main class="main">
    <div id="detail" class="detail">
      <div class="empty">Select a prompt to begin.</div>
    </div>
  </main>
</div>

<script>
/* ---------- Advanced teacher prompt library ----------
   Templates use {{key}} tokens filled by the fields below.
   Every prompt assigns an expert role, supplies context, demands a
   structured output, and invokes a pedagogical framework so the model
   returns precise, classroom-ready results. */
const GRADES = ["Kindergarten","1st–2nd grade","3rd–5th grade","6th–8th grade","9th–10th grade","11th–12th grade","College / Adult"];

const PROMPTS = [
{
  id:"lesson", cat:"Planning", title:"Standards-aligned lesson plan",
  desc:"A rigorous, differentiated single-lesson plan with gradual release.",
  fields:[
    {k:"subject",l:"Subject",t:"text",ph:"e.g. Algebra I"},
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"topic",l:"Topic / focus",t:"text",ph:"e.g. Solving two-step equations"},
    {k:"duration",l:"Length",t:"select",o:["30 minutes","45 minutes","60 minutes","90 minutes"]},
    {k:"standard",l:"Standard(s) — optional",t:"text",ph:"e.g. CCSS 7.EE.B.4",req:false,full:true},
    {k:"profile",l:"Class profile (size, prior knowledge, needs)",t:"textarea",ph:"e.g. 28 students, mixed readiness, 3 ELLs, 2 IEPs (reading)",full:true}
  ],
  tpl:
`You are an expert instructional coach and curriculum designer with deep classroom experience in {{subject}}. Design a rigorous, engaging {{duration}} lesson.

CONTEXT
• Grade/level: {{grade}}
• Topic: {{topic}}
• Standard(s): {{standard}}
• Class profile: {{profile}}

REQUIREMENTS
1. Write 1–2 measurable objectives using observable Bloom's verbs, plus student-friendly "I can…" success criteria.
2. Open with a ~5-minute hook that connects to students' real lives or a provocative question.
3. Structure with gradual release — I do (model) → We do (guided) → You do (independent) — with a timing for each part that sums to the total.
4. Embed at least 2 formative checks for understanding, and state your move if students don't get it.
5. Differentiate: one concrete scaffold for students who struggle and one extension for those ready for more.
6. Close with a 3-minute exit ticket that directly measures the objective.
7. List materials and prep.

OUTPUT
A skimmable plan with clear headings and a timing column; concise teacher-facing language. First, state any assumptions in one line. Ask up to 3 clarifying questions ONLY if a critical detail is missing; otherwise proceed.`
},
{
  id:"unit", cat:"Planning", title:"Unit plan / learning progression",
  desc:"A sequenced multi-lesson unit with essential questions and assessments.",
  fields:[
    {k:"subject",l:"Subject",t:"text",ph:"e.g. Biology"},
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"unit",l:"Unit topic",t:"text",ph:"e.g. Cell structure & function"},
    {k:"lessons",l:"Number of lessons",t:"select",o:["3","4","5","6","8","10"]},
    {k:"standards",l:"Key standards / goals",t:"textarea",ph:"Paste standards or learning goals",full:true}
  ],
  tpl:
`You are an expert curriculum designer using Understanding by Design (backward design). Build a {{lessons}}-lesson unit for {{grade}} {{subject}} on "{{unit}}".

Anchor it to these standards/goals: {{standards}}

Produce, in order:
1. One overarching Essential Question and 2–3 Enduring Understandings.
2. A summative performance assessment that would demonstrate mastery, with a 3-bullet success description.
3. A lesson-by-lesson progression as a TABLE: # | lesson focus | objective (measurable) | key activity | formative checkpoint.
4. A short list of the most common student misconceptions for this unit and where in the sequence to address each.
5. Vocabulary to pre-teach.

Sequence lessons so skills build logically. State assumptions in one line first.`
},
{
  id:"tier", cat:"Differentiation", title:"Differentiate one activity into tiers",
  desc:"Same objective, three readiness tiers, plus ELL and IEP supports.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"subject",l:"Subject",t:"text",ph:"e.g. English Language Arts"},
    {k:"activity",l:"Activity & objective to differentiate",t:"textarea",ph:"Describe the task and its learning objective",full:true},
    {k:"needs",l:"Specific learners to plan for",t:"text",ph:"e.g. 3 ELLs (beginning), 1 IEP (processing speed)",full:true}
  ],
  tpl:
`You are an expert in Universal Design for Learning and differentiated instruction. Keep the learning objective IDENTICAL across all versions — change the pathway, not the goal.

Grade/level: {{grade}} · Subject: {{subject}}
Activity & objective: {{activity}}
Learners to plan for: {{needs}}

Produce:
1. Three tiers — Approaching, On-level, Advanced — describing the SPECIFIC change to the task (not just "more/less work"). For each, give the student directions verbatim.
2. ELL supports: WIDA-aligned sentence frames and a visual/word-bank suggestion.
3. IEP accommodations tailored to the needs above.
4. For each change, one line explaining the pedagogical reason.

Keep everything usable tomorrow. Note assumptions in one line.`
},
{
  id:"scaffold", cat:"Differentiation", title:"Scaffold a complex task",
  desc:"Break a hard task into supported steps with a fade-out plan.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"subject",l:"Subject",t:"text",ph:"e.g. History"},
    {k:"task",l:"The complex task",t:"textarea",ph:"e.g. Write a DBQ essay using 4 sources",full:true},
    {k:"stuck",l:"Where students get stuck",t:"text",ph:"e.g. turning evidence into analysis",full:true}
  ],
  tpl:
`You are a literacy and cognitive-load expert. Scaffold this complex task for {{grade}} {{subject}} so every student can access it.

Task: {{task}}
Common sticking point: {{stuck}}

Provide:
1. A step-by-step breakdown (numbered), each step small and checkable.
2. Sentence starters / frames for the hardest step.
3. One fully worked example ("model") showing what good looks like.
4. A 3-stage fade plan (heavy support → partial → independent) so students eventually do it unaided.
5. A quick way to check mastery at the end.

Be concrete and classroom-ready.`
},
{
  id:"rubric", cat:"Assessment", title:"Analytic rubric generator",
  desc:"Observable, student-friendly descriptors plus a checklist version.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"assignment",l:"Assignment",t:"textarea",ph:"Describe the task being assessed",full:true},
    {k:"criteria",l:"Criteria (or leave blank to suggest)",t:"text",ph:"e.g. thesis, evidence, organization, mechanics",req:false,full:true},
    {k:"levels",l:"Performance levels",t:"select",o:["3 (Beginning/Proficient/Advanced)","4 (1–4 scale)","5 (1–5 scale)"]}
  ],
  tpl:
`You are an assessment specialist. Create an analytic rubric for this {{grade}} assignment.

Assignment: {{assignment}}
Criteria: {{criteria}} (if blank, propose 4–5 strong criteria for this task)
Levels: {{levels}}

Rules:
• For each criterion, write descriptors that differentiate levels by QUALITY (specific and observable), not by amount ("2 examples vs 3").
• Use student-friendly language a learner could self-assess against.
• Add a one-line "look-for" note per criterion for fast grading.

Output the rubric as a table, then a student-facing "Did I…?" checklist version of the same criteria.`
},
{
  id:"quiz", cat:"Assessment", title:"Quiz + answer key with misconception distractors",
  desc:"Items at a chosen rigor level; wrong answers target real misconceptions.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"subject",l:"Subject",t:"text",ph:"e.g. Chemistry"},
    {k:"topic",l:"Topic",t:"text",ph:"e.g. Balancing chemical equations"},
    {k:"num",l:"Number of items",t:"select",o:["5","8","10","15"]},
    {k:"types",l:"Item types",t:"select",o:["Multiple choice","Short answer","Mixed (MC + short answer)"]},
    {k:"rigor",l:"Rigor",t:"select",o:["Recall (DOK 1)","Application (DOK 2)","Analysis / reasoning (DOK 3)"]}
  ],
  tpl:
`You are a psychometrics-aware test designer. Write {{num}} {{types}} items on "{{topic}}" for {{grade}} {{subject}} at the {{rigor}} level.

Requirements:
• Each item assesses a clear skill — label which skill/standard.
• For multiple-choice items, write distractors where EACH one corresponds to a specific, common student misconception (not random wrong answers).
• Vary surface features so pattern-matching won't work.

Then provide an ANSWER KEY that gives, for every item: the correct answer, a one-line rationale, and — for each distractor — the misconception it reveals. End with a short note on what a wrong pattern across items would tell me about student thinking.`
},
{
  id:"exit", cat:"Assessment", title:"Targeted exit ticket",
  desc:"A 3-item formative check with next-day moves.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"objective",l:"Objective to measure",t:"text",ph:"e.g. Identify theme in a short text",full:true},
    {k:"misconception",l:"Misconception to probe — optional",t:"text",ph:"e.g. confusing theme with topic",req:false,full:true}
  ],
  tpl:
`You are a formative-assessment expert. Design a 3-item exit ticket for {{grade}} that measures this objective: {{objective}}.

• At least one item must be designed to reveal this misconception: {{misconception}}.
• Keep it doable in 3–4 minutes.

Provide the exit ticket, a quick scoring guide (what mastery vs partial vs not-yet looks like), and a specific "next-day move" for each of those three result buckets.`
},
{
  id:"comments", cat:"Feedback", title:"Report card comments",
  desc:"Specific, warm, jargon-free comments with a next step.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"subject",l:"Subject",t:"text",ph:"e.g. Math"},
    {k:"name",l:"Student first name (or [Student])",t:"text",ph:"e.g. Maya"},
    {k:"strength",l:"A genuine strength",t:"text",ph:"e.g. strong problem-solving persistence"},
    {k:"growth",l:"A growth area",t:"text",ph:"e.g. showing work / steps"},
    {k:"tone",l:"Tone",t:"select",o:["Warm & encouraging","Neutral-professional"]}
  ],
  tpl:
`You are an experienced teacher writing end-of-term report card comments. Write TWO comment options for {{name}} in {{grade}} {{subject}}.

Each comment must: name the specific strength "{{strength}}"; frame the growth area "{{growth}}" constructively; and give ONE concrete next step families can support at home. Tone: {{tone}}. 60–90 words. No jargon or labels. Use the student's name naturally and gender-neutral phrasing unless I say otherwise.`
},
{
  id:"email_concern", cat:"Communication", title:"Parent email — raising a concern",
  desc:"Empathetic, factual, solution-focused — under 200 words.",
  fields:[
    {k:"name",l:"Student first name",t:"text",ph:"e.g. Leo"},
    {k:"concern",l:"The concern (with 1–2 factual examples)",t:"textarea",ph:"e.g. Missing 4 of last 6 homework assignments; quiet in class discussions",full:true},
    {k:"goal",l:"Outcome you want",t:"text",ph:"e.g. partner on a homework routine",full:true},
    {k:"tone",l:"Tone",t:"select",o:["Empathetic & collaborative","Firm but kind"]}
  ],
  tpl:
`You are a teacher skilled in family communication and de-escalation. Draft an email to {{name}}'s parent/guardian.

Concern & specific examples: {{concern}}
Goal of the message: {{goal}}
Tone: {{tone}}

Structure: (1) open with a genuine, specific positive about {{name}}; (2) state the concern using only observable facts and the examples above — no labels or judgments; (3) briefly note the impact on learning; (4) propose 1–2 concrete next steps and explicitly invite partnership; (5) offer a quick call/meeting. Under 200 words, warm and professional, no educational jargon. Provide a clear subject line.`
},
{
  id:"email_positive", cat:"Communication", title:"Parent email — good news",
  desc:"A specific, warm note home to celebrate a win.",
  fields:[
    {k:"name",l:"Student first name",t:"text",ph:"e.g. Aisha"},
    {k:"what",l:"What happened",t:"textarea",ph:"e.g. Led her group respectfully and improved her quiz score by 20%",full:true}
  ],
  tpl:
`You are a warm, specific teacher sending good news home about {{name}}. Write a short email celebrating: {{what}}.

Include one concrete detail that shows you really noticed, connect it to a positive quality (effort, kindness, growth), and suggest one simple way the family can reinforce it. Under 130 words, genuine (not gushy). Add a friendly subject line.`
},
{
  id:"feedback", cat:"Feedback", title:"Actionable student feedback (glow & grow)",
  desc:"Feedback tied strictly to your success criteria, with a model.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"assignment",l:"Assignment",t:"text",ph:"e.g. Persuasive paragraph"},
    {k:"criteria",l:"Success criteria",t:"textarea",ph:"List the criteria the work should meet",full:true},
    {k:"work",l:"Student work (paste) or describe it",t:"textarea",ph:"Paste the student's response or summarize it",full:true}
  ],
  tpl:
`You are a teacher giving growth-oriented feedback aligned STRICTLY to the success criteria below — do not invent criteria.

Assignment: {{assignment}} ({{grade}})
Success criteria: {{criteria}}
Student work: {{work}}

Give: two specific "glows" (quote or point to exactly what met the criteria), then ONE "grow" — the single highest-leverage next step — with a short model showing what a stronger version of that part would look like. Address the student directly, encouraging and concrete. End with one reflection question for the student.`
},
{
  id:"hook", cat:"Engagement", title:"Lesson hooks / anticipatory sets",
  desc:"Three 5-minute openers that spark curiosity, with teacher scripts.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"topic",l:"Topic",t:"text",ph:"e.g. Supply and demand"},
    {k:"real",l:"Real-world angle — optional",t:"text",ph:"e.g. concert ticket prices",req:false,full:true}
  ],
  tpl:
`You are a master of student engagement. Design THREE distinct 5-minute hooks to open a {{grade}} lesson on "{{topic}}"{{real}}.

Make them different in kind — e.g. a provocative question, a surprising fact/phenomenon or data point, and a quick hands-on or thought experiment. For EACH hook give: the exact opening line the teacher says, the 1–2 minute mini-activity, and the transition sentence that connects it to today's objective. Keep them low-prep.`
},
{
  id:"discussion", cat:"Engagement", title:"Discussion questions (Bloom's ladder)",
  desc:"Eight questions ascending Bloom's, with follow-ups and frames.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"topic",l:"Topic or text",t:"text",ph:"e.g. The water cycle / a poem title"},
    {k:"content",l:"Paste text or key content — optional",t:"textarea",ph:"Optional: paste the passage or notes to ground the questions",req:false,full:true}
  ],
  tpl:
`You are a discussion-facilitation expert. Create a ladder of 8 discussion questions for {{grade}} on "{{topic}}".{{content}}

Order them ascending Bloom's Taxonomy and LABEL each (Remember → Understand → Apply → Analyze → Evaluate → Create). Then add: 2 "press for reasoning" follow-up prompts I can use on any answer, and 2 sentence frames that help reluctant students participate. Keep questions open-ended (no yes/no).`
},
{
  id:"reteach", cat:"Reteaching", title:"Reteach a misconception",
  desc:"Diagnose the root cause and reteach with a new representation.",
  fields:[
    {k:"grade",l:"Grade / level",t:"select",o:GRADES},
    {k:"subject",l:"Subject",t:"text",ph:"e.g. Math"},
    {k:"concept",l:"Concept",t:"text",ph:"e.g. Adding fractions"},
    {k:"misconception",l:"What students are doing wrong",t:"textarea",ph:"e.g. adding numerators AND denominators",full:true}
  ],
  tpl:
`You are a diagnostic teaching expert. Students in {{grade}} {{subject}} are struggling with "{{concept}}". The observed error: {{misconception}}.

1. Diagnose the likely ROOT CAUSE of this misconception (why it makes sense to the student).
2. Design a 15-minute reteach that uses a DIFFERENT representation than the usual one (visual/manipulative/analogy) — name it.
3. Give one concrete analogy students will remember.
4. Provide 2 worked examples that explicitly CONTRAST the wrong approach with the correct one, side by side.
5. Add 3 checks for understanding of increasing difficulty and a single reassessment item.

Be specific and ready to teach.`
},
{
  id:"reading", cat:"Adaptation", title:"Adapt a text to a reading level",
  desc:"Rewrite for a target level while preserving key vocabulary.",
  fields:[
    {k:"target",l:"Target reading level",t:"select",o:GRADES},
    {k:"preserve",l:"Key vocabulary to keep",t:"text",ph:"e.g. photosynthesis, chlorophyll",full:true},
    {k:"text",l:"Text to adapt (paste)",t:"textarea",ph:"Paste the passage to simplify",full:true}
  ],
  tpl:
`You are a reading specialist. Rewrite the text below for a {{target}} reading level WITHOUT losing essential content or accuracy.

Keep these key terms: {{preserve}} — and define each one in-line, in kid-friendly words, the first time it appears. Use shorter sentences and active voice; keep the logical flow.

TEXT:
{{text}}

After the rewrite, add: (1) a short glossary of the key terms in simple language, and (2) one sentence noting anything important you had to simplify so I can decide if it's acceptable.`
}
];

/* ---------- app ---------- */
const $=s=>document.querySelector(s), state={cat:"All", q:"", sel:null, vals:{}};
const cats=["All",...[...new Set(PROMPTS.map(p=>p.cat))]];

function renderChips(){
  $("#chips").innerHTML=cats.map(c=>`<span class="chip${c===state.cat?' active':''}" data-c="${c}">${c}</span>`).join("");
  document.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{state.cat=el.dataset.c;renderChips();renderList();});
}
function match(p){
  const okc=state.cat==="All"||p.cat===state.cat;
  const q=state.q.toLowerCase();
  const okq=!q||(p.title+" "+p.desc+" "+p.cat).toLowerCase().includes(q);
  return okc&&okq;
}
function renderList(){
  const items=PROMPTS.filter(match);
  $("#plist").innerHTML=items.map((p,i)=>
    `<li class="pitem${state.sel===p.id?' active':''}" data-id="${p.id}">
       <div class="idx">${String(i+1).padStart(2,"0")}</div>
       <div><div class="cat">${p.cat}</div>
         <div class="ttl">${p.title}</div>
         <div class="dsc">${p.desc}</div></div></li>`).join("")||
    `<li style="color:var(--muted);font-style:italic;font-family:var(--serif);padding:14px 6px">No prompts match.</li>`;
  document.querySelectorAll(".pitem").forEach(el=>el.onclick=()=>select(el.dataset.id));
}
function select(id){
  state.sel=id; state.vals={};
  renderList();
  const p=PROMPTS.find(x=>x.id===id);
  const fields=p.fields.map(f=>{
    const req=f.req===false?'':'<span class="req"> *</span>';
    let input;
    if(f.t==="textarea") input=`<textarea data-k="${f.k}" placeholder="${f.ph||''}"></textarea>`;
    else if(f.t==="select") input=`<select data-k="${f.k}">${f.o.map(o=>`<option value="${o}">${o}</option>`).join("")}</select>`;
    else input=`<input type="text" data-k="${f.k}" placeholder="${f.ph||''}">`;
    return `<div class="field${f.full?' full':''}"><label>${f.l}${req}</label>${input}</div>`;
  }).join("");
  $("#detail").innerHTML=
    `<div class="kick">${p.cat}</div>
     <h2>${p.title}</h2>
     <div class="sub">${p.desc}</div>
     <div class="rule"></div>
     <div class="how">Fill in the fields — the prompt updates live. Any blank you leave stays marked in <b style="color:var(--accent)">red</b> so you can spot it. Then press <b>Copy prompt</b> and paste it into your AI.</div>
     <div class="fields">${fields}</div>
     <div class="outwrap">
       <div class="outhead"><h3>Your prompt</h3>
         <div class="btns"><button class="reset" id="reset">Clear</button>
           <button class="copy" id="copy">Copy prompt</button></div></div>
       <div class="output" id="output"></div>
     </div>
     <div class="foot">Works with ChatGPT, Claude and Gemini. Written &amp; curated for teachers — edit any output to fit your class. Runs entirely offline; nothing you type leaves this page.</div>`;
  p.fields.forEach(f=>{ if(f.t==="select") state.vals[f.k]=f.o[0]; });
  document.querySelectorAll("[data-k]").forEach(el=>{
    if(el.tagName==="SELECT") el.value=state.vals[el.dataset.k]||el.options[0].value;
    el.addEventListener("input",()=>{state.vals[el.dataset.k]=el.value;renderOutput();});
  });
  $("#copy").onclick=copyOut; $("#reset").onclick=()=>select(id);
  renderOutput();
}
function fill(tpl,vals,forHtml){
  return tpl.replace(/\{\{(\w+)\}\}/g,(m,k)=>{
    const v=(vals[k]||"").trim();
    if(v) return forHtml?escapeHtml(v):v;
    const f=PROMPTS.find(x=>x.id===state.sel).fields.find(x=>x.k===k);
    const label="["+(f?f.l.replace(/ —.*/,''):k)+"]";
    return forHtml?`<span class="blank">${escapeHtml(label)}</span>`:label;
  });
}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function renderOutput(){
  const p=PROMPTS.find(x=>x.id===state.sel);
  $("#output").innerHTML=fill(p.tpl,state.vals,true);
}
function copyOut(){
  const p=PROMPTS.find(x=>x.id===state.sel);
  const text=fill(p.tpl,state.vals,false);
  const done=()=>{const b=$("#copy");b.textContent="Copied ✓";b.classList.add("done");setTimeout(()=>{b.textContent="Copy prompt";b.classList.remove("done");},1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done));}
  else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}document.body.removeChild(ta);
}
$("#search").addEventListener("input",e=>{state.q=e.target.value;renderList();});
renderChips();renderList();
</script>
